apply plugin: 'com.android.application'
apply plugin: 'com.google.firebase.crashlytics'

android {
    namespace 'ru.mgusev.eldritchhorror'
    compileSdk 37
    defaultConfig {
        applicationId "ru.mgusev.eldritchhorror"
        minSdk 23
        targetSdk 37
        versionCode 58
        versionName "2.5.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "FileBaseUrl", '"https://mgusevstudio.ru/images/files"'
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-DEBUG'
            buildConfigField "String", "FileBaseUrl", '"https://mgusevstudio.ru/images/files"'
        }
    }
    compileOptions {
        targetCompatibility 1.8
        sourceCompatibility 1.8
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    defaultConfig {
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }
    lint {
        disable 'RestrictedApi'
    }
}

repositories {
    mavenCentral()
    maven {
        url 'https://jitpack.io'
    }
}

dependencies {
    configurations {
        all*.exclude group: 'com.android.support', module: 'support-v13'
    }

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation libs.appcompat
    implementation libs.core
    implementation libs.legacy.support.v4
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.cardview
    implementation libs.recyclerview
    implementation libs.exifinterface
    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.espresso.core

    implementation libs.moxy
    annotationProcessor libs.moxy.compiler
    implementation libs.moxy.androidx

    implementation libs.ormlite.android
    implementation libs.sqliteassethelper
    implementation libs.rxjava
    implementation libs.rxandroid
    implementation libs.dagger
    annotationProcessor libs.dagger.compiler

    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    implementation libs.asset.sqlite.open.helper

    implementation libs.swipelayout

    implementation libs.mpandroidchart

    implementation platform(libs.firebase.bom)
    implementation libs.firebase.database
    implementation libs.firebase.auth
    implementation libs.play.services.auth

    implementation libs.rxfirebase
    implementation libs.firebase.crashlytics
    implementation libs.firebase.analytics

    implementation libs.fresco

    implementation libs.firebase.storage

    implementation libs.billing

    implementation(libs.imagepicker) {
        exclude group: 'com.github.bumptech.glide', module: 'glide'
    }

    implementation libs.fab.speed.dial
    implementation libs.timber

    // Retrofit http://square.github.io/retrofit
    implementation libs.retrofit
    implementation libs.retrofit.rxjava2
    implementation libs.retrofit.gson

    //RxBinding https://github.com/JakeWharton/RxBinding
    implementation libs.rxbinding

    //https://github.com/tiper/MaterialSpinner
    implementation libs.material.spinner

    //https://github.com/hakobast/DropdownTextView
//    implementation 'com.github.hakobast:dropdown-textview:0.3.1'

    implementation libs.exoplayer
    implementation libs.exoplayer.okhttp
}

apply plugin: 'com.google.gms.google-services'
